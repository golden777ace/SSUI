# SSUI — корневой workspace.
# Ядро движка живёт в crate `core` (имя пакета `ssui-core`).
# Позже сюда добавятся `bindings` (PyO3) и другие члены workspace.

[workspace]
resolver = "2"
members = ["core"]

[profile.release]
# Настройки под наши цели: минимум размера и максимум производительности.
opt-level = 3
lto = "thin"        # межмодульная оптимизация без запредельного времени сборки
codegen-units = 1   # лучше оптимизация ценой скорости компиляции
panic = "abort"     # меньше кода, нет раскрутки стека (для GUI-рантайма ок)
strip = true        # убрать символы из релизного бинарника
