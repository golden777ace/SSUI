[package]
name = "ssui-python"
version = "1.12.0"
edition = "2021"
license = "MIT"
description = "Python-биндинги SSUI через PyO3."
repository = "https://github.com/golden777ace/SSUI"

[lib]
name = "_ssui"
crate-type = ["cdylib"]

[dependencies]
ssui-core = { path = "../core" }

[dependencies.pyo3]
version = "0.23"
features = ["extension-module", "abi3-py311"]